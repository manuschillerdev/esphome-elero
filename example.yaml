external_components:
  - source: github://manuschillerdev/esphome-elero

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# Elero RF hub (CC1101 868 MHz default)
elero:
  cs_pin: GPIO5
  gdo0_pin: GPIO26
  # 868.95 MHz Elero alt — most newer motors. Use 0x7a for 868.35 MHz.
  freq0: 0xc0
  freq1: 0x71
  freq2: 0x21

# Pick exactly ONE output adapter:
#
# `elero_nvs:`  → ESPHome native API. Devices live in NVS, surfaced as
#                  cover/light entities at boot. After adding/removing devices
#                  via the web UI, reboot once so HA sees the changes.
#
# `elero_mqtt:` → MQTT HA discovery. Devices live in NVS, published over MQTT.
#                  Add/remove devices in the web UI — HA picks them up immediately.

elero_nvs:

# Web UI: device management, RF discovery, backup & restore.
# After flashing, open http://<host>/elero → Hub → Add device, or:
#   1. Run the migration script on your old YAML:
#        uv run scripts/migrate_yaml_to_json.py old.yaml -o backup.json
#   2. Hub → Backup & Restore → Restore from backup → backup.json
web_server_base:
  port: 80

elero_web:
  id: elero_web_ui

# Optional: HA switch to disable the web UI at runtime.
switch:
  - platform: elero_web
    name: "Elero Web UI"
    id: elero_web_switch
    restore_mode: RESTORE_DEFAULT_ON
