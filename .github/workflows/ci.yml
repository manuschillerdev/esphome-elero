name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build frontend header (needed by ESPHome compile tests)
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: node pnpm

      - name: Install dependencies
        working-directory: components/elero_web/frontend/app
        run: mise exec node pnpm -- pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: components/elero_web/frontend/app
        run: mise exec node pnpm -- pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: elero_web_ui
          path: components/elero_web/elero_web_ui.h
          retention-days: 1

  # ESPHome compile tests for each platform
  esphome-compile:
    name: ESPHome Compile (${{ matrix.test }})
    runs-on: ubuntu-latest
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        test:
          - test.esp32-s3-ard
          - test.esp32-s3-idf
          - test.esp32-ard
          - test.esp32-minimal
          - test.esp32-mqtt
          - test.esp32-nvs
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: python uv

      - name: Install Python dependencies
        run: mise exec python uv -- uv sync --locked

      - uses: actions/download-artifact@v4
        with:
          name: elero_web_ui
          path: components/elero_web/

      - name: Compile ${{ matrix.test }}
        run: mise exec python uv -- uv run esphome compile tests/${{ matrix.test }}.yaml

  # Unit tests for protocol layer
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: aqua:Kitware/CMake

      - name: Configure CMake
        run: mise exec aqua:Kitware/CMake -- cmake -B build -S tests/unit

      - name: Build
        run: mise exec aqua:Kitware/CMake -- cmake --build build

      - name: Run tests with JUnit XML output
        run: mise exec aqua:Kitware/CMake -- cmake --build build --target test_xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results.xml
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: build/test-results.xml
          reporter: java-junit

  # Python code validation (formatting removed - not enforced)
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: python uv

      - name: Install Python dependencies
        run: mise exec python uv -- uv sync --locked

      - name: Lint Python files
        run: mise exec python uv -- uv run ruff check components/

      - name: Run Python tests
        run: mise exec python uv -- uv run pytest
