name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_call:
    inputs:
      esphome_version:
        description: Exact ESPHome compatibility target; empty uses the locked project version
        type: string
        required: false
        default: ''

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verify the bundled frontend matches its source.
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: node pnpm

      - name: Install dependencies
        working-directory: components/elero_web/frontend/app
        run: mise exec node pnpm -- pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: components/elero_web/frontend/app
        run: mise exec node pnpm -- pnpm build

      - name: Check frontend
        working-directory: components/elero_web/frontend/app
        run: |
          mise exec node pnpm -- pnpm lint
          mise exec node pnpm -- pnpm typecheck

      - name: Verify bundled frontend is tracked and up to date
        run: |
          git ls-files --error-unmatch components/elero_web/elero_web_ui.h
          git diff --exit-code -- components/elero_web/elero_web_ui.h

  # ESPHome compile tests for each platform
  esphome-compile:
    name: ESPHome Compile (${{ matrix.test }})
    runs-on: ubuntu-latest
    needs: build-frontend
    timeout-minutes: 60
    env:
      ESPHOME_VERSION: ${{ inputs.esphome_version }}
    strategy:
      fail-fast: false
      matrix:
        test:
          - test.esp32-s3-ard
          - test.esp32-s3-idf
          - test.esp32-ard
          - test.esp32-minimal
          - test.esp32-mqtt
          - test.esp32-nvs
          - test.esp32-c6-idf
          - test.esp32-sx1262-idf
          - test.esp32-sx1276-idf
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: python uv

      - name: Install Python dependencies
        run: mise exec python uv -- uv sync --locked

      - name: Report ESPHome version under test
        run: mise exec python uv -- bash .github/scripts/uv-run.sh esphome version

      - name: Compile ${{ matrix.test }}
        run: mise exec python uv -- bash .github/scripts/uv-run.sh esphome compile tests/${{ matrix.test }}.yaml

  # Unit tests for protocol layer
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: python uv aqua:Kitware/CMake

      - name: Configure CMake
        run: mise exec python uv aqua:Kitware/CMake -- cmake -B build -S tests/unit

      - name: Build
        run: mise exec python uv aqua:Kitware/CMake -- cmake --build build

      - name: Run tests with JUnit XML output
        run: mise exec python uv aqua:Kitware/CMake -- cmake --build build --target test_xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results.xml
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: build/test-results.xml
          reporter: java-junit

  # Use the same Python checks as local development.
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    env:
      ESPHOME_VERSION: ${{ inputs.esphome_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: python uv

      - name: Install Python dependencies
        run: mise exec python uv -- uv sync --locked

      - name: Report ESPHome version under test
        run: mise exec python uv -- bash .github/scripts/uv-run.sh esphome version

      - name: Lint Python files
        run: mise exec python uv -- bash .github/scripts/uv-run.sh ruff check .

      - name: Check Python formatting
        run: mise exec python uv -- bash .github/scripts/uv-run.sh ruff format --check .

      - name: Check Python types
        run: mise exec python uv -- bash .github/scripts/uv-run.sh ty check

      - name: Run Python tests
        run: mise exec python uv -- bash .github/scripts/uv-run.sh pytest
