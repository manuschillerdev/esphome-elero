esphome:
  name: elero-gateway
  friendly_name: Elero Gateway
  on_boot:
    priority: 800
    then:
      - switch.turn_on: power_on
      - switch.turn_on: cc1101_power_on
      # SW1:0 SW0:1 = 868/915MHz
      - switch.turn_off: rf_sw1
      - switch.turn_on: rf_sw0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_VFS_SUPPORT_SELECT: "y"
  flash_size: 16MB

switch:
  - platform: gpio
    pin: { number: GPIO15, mode: { output: true } }
    id: cc1101_power_on
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: { number: GPIO46, mode: { output: true } }
    id: power_on
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: GPIO47
    id: rf_sw1
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO48
    id: rf_sw0
    restore_mode: ALWAYS_ON

spi:
  clk_pin: GPIO11
  mosi_pin: GPIO9
  miso_pin: GPIO10

elero:
  cs_pin: GPIO12
  gdo0_pin: GPIO3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

external_components:
  - source: github://manuschillerdev/esphome-elero@dev

elero_web:

# Home Assistant connection
api:
  encryption:
    key: !secret elero_api_key

elero_nvs:
