# LILYGO LoRa32 / TTGO, ESP32-PICO-D4 + onboard SX1276 (868 MHz).
# Includes a prebuilt web UI; see docs/ESPHOME-2026-LILYGO.md.
esphome:
  name: lilygo-lora32
  friendly_name: LilyGO Elero
  min_version: 2026.8.2

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: ../components

spi:
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

elero:
  radio: sx1276
  cs_pin: GPIO18
  irq_pin: GPIO26
  rst_pin: GPIO23
  pa_power: 17
  freq0: 0x7a
  freq1: 0x71
  freq2: 0x21

elero_nvs:

elero_web:
  port: 80
