# Compile-only SX1262 ESP-IDF fixture; no network credentials or real devices.
esphome:
  name: test-esp32-sx1262-idf
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
logger:
external_components:
  - source:
      type: local
      path: ../components
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11
elero:
  radio: sx1262
  cs_pin: GPIO8
  irq_pin: GPIO14
  busy_pin: GPIO13
  rst_pin: GPIO12
  tcxo_voltage: 1.8
  rf_switch: true
