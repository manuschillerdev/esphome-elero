# Common test configuration for esphome-elero compile tests.
# Devices are no longer YAML-defined — see RFC-002 (NVS-only).
# Platform-specific tests include this file and add their own esphome: block.

external_components:
  - source:
      type: local
      path: ../components

# SPI bus configuration (pins vary by platform, set in platform-specific files)
spi:
  clk_pin: ${spi_clk}
  mosi_pin: ${spi_mosi}
  miso_pin: ${spi_miso}

# Elero hub configuration
elero:
  cs_pin: ${spi_cs}
  gdo0_pin: ${gdo0_pin}
  freq0: 0x7a
  freq1: 0x71
  freq2: 0x21

# Native ESPHome API + NVS device persistence (default test mode)
elero_nvs:

# Web UI for device management, RF discovery, and backup/restore
elero_web:
  port: 80
