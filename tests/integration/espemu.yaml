# Verification fixture: real CC1101 driver on ESP32-S3, no elero_test override.
esphome:
  name: elero-espemu

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: myssid
  password: mypassword
  reboot_timeout: 0s

mqtt:
  broker: 192.168.4.1
  discovery: false
  reboot_timeout: 0s

external_components:
  - source:
      type: local
      path: ../../components

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

elero:
  cs_pin: GPIO10
  irq_pin: GPIO9

elero_mqtt:
  topic_prefix: elero_probe
  device_name: Elero Emulator Probe

elero_web:
  port: 80

binary_sensor:
  - platform: gpio
    pin: GPIO8
    name: Emulator IRQ Probe
    on_press:
      - logger.log: ESP_EMU_GPIO_IRQ
