asyncapi: 3.0.0

info:
  title: Elero WebSocket API
  version: 2.0.0
  description: |
    Real-time WebSocket interface for the esphome-elero gateway.

    The server is a **stateless pipe** — it forwards RF packets and logs to clients,
    and routes commands from clients to the Elero hub. All state derivation
    (discovery, blind positions, device states) happens client-side.

    ## Connection

    Connect via WebSocket at `ws://<device-ip>:<port>/elero/ws`.
    On successful connection the server immediately sends a `config` event.

    ## Message Envelope

    All messages use a JSON envelope:

    ```json
    { "event": "<event_name>", "data": { ... } }
    ```

    Server-to-client messages use the `event` + `data` envelope.
    Client-to-server messages use a flat JSON object with a `type` field.

    ## Operating Modes

    The `mode` field in the `config` event indicates the operating mode:
    - `native` — devices stored in NVS, surfaced via ESPHome native API
    - `mqtt`   — devices stored in NVS, surfaced via MQTT HA discovery

    CRUD operations (`upsert_device`, `remove_device`, `import_config`) are
    always available — every mode persists devices in NVS.

servers:
  device:
    host: "{device_ip}:{port}"
    pathname: /elero/ws
    protocol: ws
    description: ESP32 gateway WebSocket endpoint (Mongoose HTTP server)
    variables:
      device_ip:
        description: IP address or hostname of the ESP32 device
        default: 192.168.1.100
      port:
        description: HTTP server port (configured via `web_server_base`)
        default: "80"

channels:
  eleroWs:
    address: /elero/ws
    messages:
      configEvent:
        $ref: "#/components/messages/configEvent"
      rfEvent:
        $ref: "#/components/messages/rfEvent"
      deviceUpsertedEvent:
        $ref: "#/components/messages/deviceUpsertedEvent"
      deviceRemovedEvent:
        $ref: "#/components/messages/deviceRemovedEvent"
      groupUpsertedEvent:
        $ref: "#/components/messages/groupUpsertedEvent"
      groupRemovedEvent:
        $ref: "#/components/messages/groupRemovedEvent"
      stateChangedEvent:
        $ref: "#/components/messages/stateChangedEvent"
      errorEvent:
        $ref: "#/components/messages/errorEvent"
      cmdMessage:
        $ref: "#/components/messages/cmdMessage"
      rawMessage:
        $ref: "#/components/messages/rawMessage"
      upsertDeviceMessage:
        $ref: "#/components/messages/upsertDeviceMessage"
      removeDeviceMessage:
        $ref: "#/components/messages/removeDeviceMessage"
      upsertGroupMessage:
        $ref: "#/components/messages/upsertGroupMessage"
      removeGroupMessage:
        $ref: "#/components/messages/removeGroupMessage"
      groupCmdMessage:
        $ref: "#/components/messages/groupCmdMessage"
      restartMessage:
        $ref: "#/components/messages/restartMessage"
      setHubConfigMessage:
        $ref: "#/components/messages/setHubConfigMessage"
      hubConfigEvent:
        $ref: "#/components/messages/hubConfigEvent"
      exportConfigMessage:
        $ref: "#/components/messages/exportConfigMessage"
      configSnapshotEvent:
        $ref: "#/components/messages/configSnapshotEvent"
      importConfigMessage:
        $ref: "#/components/messages/importConfigMessage"
      importResultEvent:
        $ref: "#/components/messages/importResultEvent"
      learnInStateEvent:
        $ref: "#/components/messages/learnInStateEvent"
      learnInStartMessage:
        $ref: "#/components/messages/learnInStartMessage"
      learnInConfirmUpMessage:
        $ref: "#/components/messages/learnInConfirmUpMessage"
      learnInConfirmDownMessage:
        $ref: "#/components/messages/learnInConfirmDownMessage"
      learnInCancelMessage:
        $ref: "#/components/messages/learnInCancelMessage"

operations:
  receiveConfig:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive device configuration on connect
    description: Sent immediately after WebSocket upgrade. Contains configured devices, frequency, and operating mode.
    messages:
      - $ref: "#/channels/eleroWs/messages/configEvent"

  receiveRf:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive decoded RF packets
    description: Every RF packet decoded by the CC1101 transceiver is broadcast to all connected clients.
    messages:
      - $ref: "#/channels/eleroWs/messages/rfEvent"

  receiveDeviceUpserted:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive device upserted notification
    description: Broadcast when a device is created or updated in NVS (CRUD modes only).
    messages:
      - $ref: "#/channels/eleroWs/messages/deviceUpsertedEvent"

  receiveDeviceRemoved:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive device removed notification
    description: Broadcast when a device is removed from NVS (CRUD modes only).
    messages:
      - $ref: "#/channels/eleroWs/messages/deviceRemovedEvent"

  receiveGroupUpserted:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive group upserted notification
    description: Broadcast when a saved group is created or updated in NVS.
    messages:
      - $ref: "#/channels/eleroWs/messages/groupUpsertedEvent"

  receiveGroupRemoved:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive group removed notification
    description: Broadcast when a saved group is removed from NVS.
    messages:
      - $ref: "#/channels/eleroWs/messages/groupRemovedEvent"

  receiveStateChanged:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive device state change (optimistic update)
    description: |
      Broadcast when a device's state changes — from user commands (optimistic),
      RF status responses (confirmed), or timeouts (recovery). Contains a snapshot
      of the device's derived state computed from the FSM at the moment of change.
      Enables immediate UI feedback on command, auto-healed by subsequent RF responses.
    messages:
      - $ref: "#/channels/eleroWs/messages/stateChangedEvent"

  receiveError:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive error response
    description: Sent to the originating client when a command fails validation or execution.
    messages:
      - $ref: "#/channels/eleroWs/messages/errorEvent"

  sendCmd:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Send a command to a configured blind or light
    description: Routes the action to the matching cover or light entity by address.
    messages:
      - $ref: "#/channels/eleroWs/messages/cmdMessage"

  sendRaw:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Send a raw RF packet
    description: Builds and transmits a raw RF packet for protocol testing and debugging.
    messages:
      - $ref: "#/channels/eleroWs/messages/rawMessage"

  sendUpsertDevice:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Create or update a device in NVS
    description: |
      Available only when `crud` is `true` in the config event.
      Address + device_type together identify the device. All other fields are updateable.
    messages:
      - $ref: "#/channels/eleroWs/messages/upsertDeviceMessage"

  sendRemoveDevice:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Remove a device from NVS
    description: Available only when `crud` is `true` in the config event.
    messages:
      - $ref: "#/channels/eleroWs/messages/removeDeviceMessage"

  sendUpsertGroup:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Create or update a saved group in NVS
    description: |
      Available only when `crud` is `true` in the config event. The backend
      validates that `device_ids` resolve to existing non-remote devices and
      that all resolved devices have the same derived type.
    messages:
      - $ref: "#/channels/eleroWs/messages/upsertGroupMessage"

  sendRemoveGroup:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Remove a saved group from NVS
    description: Available only when `crud` is `true` in the config event.
    messages:
      - $ref: "#/channels/eleroWs/messages/removeGroupMessage"

  sendGroupCmd:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Send an action to all members of a saved group
    description: |
      Backend resolves the group, derives the common member type, partitions
      members by registered remote/src address, and emits one RF group command
      per remote bucket. Incoming RF/status handling remains per-device.
    messages:
      - $ref: "#/channels/eleroWs/messages/groupCmdMessage"

  sendRestart:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Restart the ESP32 device
    description: |
      Triggers a safe reboot of the ESP32. Used in `native_nvs` mode to apply
      NVS config changes (added/removed devices) to the ESPHome native API.
    messages:
      - $ref: "#/channels/eleroWs/messages/restartMessage"

  sendSetHubConfig:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Update hub-level config (e.g., display name override)
    description: |
      Persists the hub display name to NVS. An empty `name` clears the override
      and falls back to the YAML-configured default. Server broadcasts a
      `hub_config` event with the effective name after applying.
    messages:
      - $ref: "#/channels/eleroWs/messages/setHubConfigMessage"

  receiveHubConfig:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive hub-config change notification
    description: Broadcast when the hub display name override changes.
    messages:
      - $ref: "#/channels/eleroWs/messages/hubConfigEvent"

  sendExportConfig:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Request a full configuration snapshot for backup
    description: |
      Server replies (to the requesting client only) with a `config_snapshot`
      event containing the versioned JSON envelope (hub overrides + every active
      device). Intended for download to a local file by the client.
    messages:
      - $ref: "#/channels/eleroWs/messages/exportConfigMessage"

  receiveConfigSnapshot:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive a configuration snapshot
    description: Sent in response to `export_config`. Contains the full backup envelope.
    messages:
      - $ref: "#/channels/eleroWs/messages/configSnapshotEvent"

  sendImportConfig:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Restore devices and hub overrides from a snapshot
    description: |
      Validates the snapshot envelope version, then `upsert`s each device and
      applies hub-level overrides. Existing devices with the same `(type, dst_address)`
      are updated in place. Server replies with an `import_result` event summary.
    messages:
      - $ref: "#/channels/eleroWs/messages/importConfigMessage"

  receiveImportResult:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive import operation summary
    description: Sent in response to `import_config`. Reports added/updated/skipped counts and per-entry errors.
    messages:
      - $ref: "#/channels/eleroWs/messages/importResultEvent"

  receiveLearnInState:
    action: receive
    channel:
      $ref: "#/channels/eleroWs"
    summary: Receive learn-in session state updates
    description: |
      Broadcast when the backend learn-in session changes state. This is a thin
      domain event from the C++ backend; clients use it to drive onboarding UX.
    messages:
      - $ref: "#/channels/eleroWs/messages/learnInStateEvent"

  sendLearnInStart:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Start a learn-in session
    description: |
      Starts the backend learn-in state machine using the given virtual remote
      source address, channel, and empirically determined programming command.
      Frontends remain responsible for instructing the user to power-cycle the
      motor before calling this.
    messages:
      - $ref: "#/channels/eleroWs/messages/learnInStartMessage"

  sendLearnInConfirmUp:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Confirm the upward learn-in step
    description: Sent when the user observes the motor moving upward during learn-in.
    messages:
      - $ref: "#/channels/eleroWs/messages/learnInConfirmUpMessage"

  sendLearnInConfirmDown:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Confirm the downward learn-in step
    description: Sent when the user observes the motor moving downward during learn-in.
    messages:
      - $ref: "#/channels/eleroWs/messages/learnInConfirmDownMessage"

  sendLearnInCancel:
    action: send
    channel:
      $ref: "#/channels/eleroWs"
    summary: Cancel the active learn-in session
    description: Cancels the backend learn-in session, if any.
    messages:
      - $ref: "#/channels/eleroWs/messages/learnInCancelMessage"

components:
  messages:
    configEvent:
      name: config
      title: Configuration Event
      summary: Device configuration sent on WebSocket connect
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConfigEventEnvelope"

    rfEvent:
      name: rf
      title: RF Packet Event
      summary: Decoded RF packet from the CC1101 transceiver
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RfEventEnvelope"

    deviceUpsertedEvent:
      name: device_upserted
      title: Device Upserted Event
      summary: A device was created or updated in NVS
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DeviceUpsertedEnvelope"

    deviceRemovedEvent:
      name: device_removed
      title: Device Removed Event
      summary: A device was removed from NVS
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CrudEventEnvelope"

    groupUpsertedEvent:
      name: group_upserted
      title: Group Upserted Event
      summary: A saved group was created or updated in NVS
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GroupUpsertedEnvelope"

    groupRemovedEvent:
      name: group_removed
      title: Group Removed Event
      summary: A saved group was removed from NVS
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GroupRemovedEnvelope"

    stateChangedEvent:
      name: state_changed
      title: State Changed Event
      summary: Device state snapshot (optimistic update or RF-confirmed)
      contentType: application/json
      payload:
        $ref: "#/components/schemas/StateChangedEnvelope"

    errorEvent:
      name: error
      title: Error Event
      summary: Error response for a failed client command
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ErrorEventEnvelope"

    cmdMessage:
      name: cmd
      title: Command Message
      summary: Send a high-level action to a configured device
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CmdPayload"

    rawMessage:
      name: raw
      title: Raw RF Message
      summary: Send a raw RF packet for protocol testing
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RawPayload"

    upsertDeviceMessage:
      name: upsert_device
      title: Upsert Device Message
      summary: Create or update a device in NVS storage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/UpsertDevicePayload"

    removeDeviceMessage:
      name: remove_device
      title: Remove Device Message
      summary: Remove a device from NVS storage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RemoveDevicePayload"

    upsertGroupMessage:
      name: upsert_group
      title: Upsert Group Message
      summary: Create or update a saved group in NVS storage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/UpsertGroupPayload"

    removeGroupMessage:
      name: remove_group
      title: Remove Group Message
      summary: Remove a saved group from NVS storage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RemoveGroupPayload"

    groupCmdMessage:
      name: group_cmd
      title: Group Command Message
      summary: Send an action to all members of a saved group
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GroupCmdPayload"

    restartMessage:
      name: restart
      title: Restart Message
      summary: Trigger a safe reboot of the ESP32
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RestartPayload"

    setHubConfigMessage:
      name: set_hub_config
      title: Set Hub Config Message
      summary: Update hub-level settings (display name override)
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SetHubConfigPayload"

    hubConfigEvent:
      name: hub_config
      title: Hub Config Event
      summary: Hub-level config changed (e.g., display name)
      contentType: application/json
      payload:
        $ref: "#/components/schemas/HubConfigEventEnvelope"

    exportConfigMessage:
      name: export_config
      title: Export Config Message
      summary: Request a configuration snapshot
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ExportConfigPayload"

    configSnapshotEvent:
      name: config_snapshot
      title: Config Snapshot Event
      summary: Versioned snapshot of hub overrides and all active devices
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConfigSnapshotEventEnvelope"

    importConfigMessage:
      name: import_config
      title: Import Config Message
      summary: Restore devices and hub overrides from a snapshot
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ImportConfigPayload"

    importResultEvent:
      name: import_result
      title: Import Result Event
      summary: Summary of an import operation (added/updated/skipped + per-entry errors)
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ImportResultEventEnvelope"

    learnInStateEvent:
      name: learn_in_state
      title: Learn-In State Event
      summary: Current backend learn-in session state
      contentType: application/json
      payload:
        $ref: "#/components/schemas/LearnInStateEventEnvelope"

    learnInStartMessage:
      name: learn_in_start
      title: Learn-In Start Message
      summary: Start a backend learn-in session
      contentType: application/json
      payload:
        $ref: "#/components/schemas/LearnInStartPayload"

    learnInConfirmUpMessage:
      name: learn_in_confirm_up
      title: Learn-In Confirm Up Message
      summary: Confirm the upward learn-in movement step
      contentType: application/json
      payload:
        $ref: "#/components/schemas/LearnInConfirmUpPayload"

    learnInConfirmDownMessage:
      name: learn_in_confirm_down
      title: Learn-In Confirm Down Message
      summary: Confirm the downward learn-in movement step
      contentType: application/json
      payload:
        $ref: "#/components/schemas/LearnInConfirmDownPayload"

    learnInCancelMessage:
      name: learn_in_cancel
      title: Learn-In Cancel Message
      summary: Cancel the active backend learn-in session
      contentType: application/json
      payload:
        $ref: "#/components/schemas/LearnInCancelPayload"

  schemas:
    # ── Server → Client Envelopes ──

    ConfigEventEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: config
        data:
          $ref: "#/components/schemas/ConfigData"

    RfEventEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: rf
        data:
          $ref: "#/components/schemas/RfData"

    DeviceUpsertedEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      description: Envelope for device_upserted events with full device config.
      properties:
        event:
          type: string
          const: device_upserted
        data:
          $ref: "#/components/schemas/DeviceUpsertedData"

    CrudEventEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      description: Envelope for device_removed events.
      properties:
        event:
          type: string
          const: device_removed
        data:
          $ref: "#/components/schemas/CrudEventData"

    GroupUpsertedEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      description: Envelope for group_upserted events.
      properties:
        event:
          type: string
          const: group_upserted
        data:
          $ref: "#/components/schemas/GroupConfig"

    GroupRemovedEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      description: Envelope for group_removed events.
      properties:
        event:
          type: string
          const: group_removed
        data:
          $ref: "#/components/schemas/GroupRemovedData"

    StateChangedEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: state_changed
        data:
          $ref: "#/components/schemas/StateChangedData"

    ErrorEventEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: error
        data:
          $ref: "#/components/schemas/ErrorData"

    LearnInStateEventEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: learn_in_state
        data:
          $ref: "#/components/schemas/LearnInStateData"

    # ── Server → Client Data ──

    ConfigData:
      type: object
      additionalProperties: false
      required: [hub, radio, blinds, lights, remotes, groups]
      properties:
        hub:
          $ref: "#/components/schemas/HubConfig"
        radio:
          $ref: "#/components/schemas/RadioConfig"
        blinds:
          type: array
          description: Configured cover entities
          items:
            $ref: "#/components/schemas/BlindConfig"
        lights:
          type: array
          description: Configured light entities
          items:
            $ref: "#/components/schemas/LightConfig"
        remotes:
          type: array
          description: Known remote controls. In native mode, derived from cover/light src_address. In NVS modes, includes auto-discovered remotes.
          items:
            $ref: "#/components/schemas/RemoteConfig"
        groups:
          type: array
          description: Saved device groups. Group device ids reference stable device address ids from blinds/lights.
          items:
            $ref: "#/components/schemas/GroupConfig"

    HubConfig:
      type: object
      additionalProperties: false
      required: [device, version, mode, crud, name, default_src_address]
      description: Gateway identity and operating mode
      properties:
        device:
          type: string
          description: ESPHome device name (from `esphome.name` in YAML)
          examples: ["elero-gateway"]
        version:
          type: string
          description: Component version string
          examples: ["1.2.3"]
        mode:
          $ref: "#/components/schemas/HubMode"
        crud:
          type: boolean
          description: Whether CRUD operations (upsert_device, remove_device) are supported
        name:
          type: string
          description: |
            Hub display name shown in Home Assistant (gateway device block) and in the web UI.
            Defaults to the YAML-configured value (`elero_mqtt.device_name`); can be overridden
            at runtime and persisted to NVS via `set_hub_config`.
          examples: ["Elero Gateway", "Living Room Hub"]
        default_src_address:
          type: string
          description: |
            Deterministic default 3-byte virtual remote/source address derived from the hub's
            hardware MAC address. Used as the default learn-in remote identity unless the user
            overrides it or restores a backup onto different hardware.
          examples: ["0xb42f01"]

    RadioConfig:
      type: object
      additionalProperties: false
      required: [chipset, rx_sensitivity, freq]
      description: RF radio hardware configuration and capabilities
      properties:
        chipset:
          type: string
          description: Radio chip identifier
          examples: ["cc1101", "sx1262"]
        rx_sensitivity:
          type: integer
          description: Receiver sensitivity in dBm (e.g., -104 for CC1101, -117 for SX1262). Used to derive signal strength thresholds.
          examples: [-104, -117]
        freq:
          $ref: "#/components/schemas/FreqConfig"

    FreqConfig:
      type: object
      additionalProperties: false
      required: [freq2, freq1, freq0]
      description: Frequency register values (chip-specific encoding)
      properties:
        freq2:
          type: string
          description: FREQ2 register (hex string)
          examples: ["0x21"]
        freq1:
          type: string
          description: FREQ1 register (hex string)
          examples: ["0x71"]
        freq0:
          type: string
          description: FREQ0 register (hex string). 0x7a = 868.35 MHz, 0xc0 = 868.95 MHz.
          examples: ["0x7a"]

    BlindConfig:
      type: object
      additionalProperties: false
      required: [address, name, channel, remote, open_ms, close_ms, poll_ms, supports_tilt, enabled]
      properties:
        address:
          type: string
          description: 3-byte destination address (hex string)
          examples: ["0xa831e5"]
        name:
          type: string
          description: Entity name
          examples: ["Living Room Blind"]
        channel:
          type: integer
          description: RF channel number
          examples: [5]
        remote:
          type: string
          description: 3-byte source/remote address (hex string)
          examples: ["0xb42f01"]
        enabled:
          type: boolean
          description: Whether the device is published to Home Assistant
        open_ms:
          type: integer
          description: Full open duration in milliseconds (0 = position tracking disabled)
          examples: [25000]
        close_ms:
          type: integer
          description: Full close duration in milliseconds (0 = position tracking disabled)
          examples: [23000]
        poll_ms:
          type: integer
          description: Status poll interval in milliseconds
          examples: [300000]
        supports_tilt:
          type: boolean
          description: Whether the blind supports tilt
        updated_at:
          type: integer
          description: Timestamp (millis()) when last persisted to NVS (0 = YAML-defined)
          examples: [1234567]
        position:
          type: number
          format: float
          description: Last known cover position (0.0 = closed, 1.0 = open)
        state:
          type: string
          description: Last known state byte (hex string, e.g. "0x01" = top)
          examples: ["0x0d"]
        rssi:
          type: number
          format: float
          description: Last known RSSI in dBm
          examples: [-65.5]
        last_seen:
          type: integer
          description: Timestamp (millis()) of last RF packet from this blind
          examples: [408]

    LightConfig:
      type: object
      additionalProperties: false
      required: [address, name, channel, remote, dim_ms, enabled]
      properties:
        address:
          type: string
          description: 3-byte destination address (hex string)
          examples: ["0xc41a2b"]
        name:
          type: string
          description: Entity name
          examples: ["Patio Light"]
        channel:
          type: integer
          description: RF channel number
          examples: [3]
        remote:
          type: string
          description: 3-byte source/remote address (hex string)
          examples: ["0xd51e03"]
        enabled:
          type: boolean
          description: Whether the device is published to Home Assistant
        dim_ms:
          type: integer
          description: Dim duration in milliseconds (0 = on/off only)
          examples: [5000]
        updated_at:
          type: integer
          description: Timestamp (millis()) when last persisted to NVS (0 = YAML-defined)
          examples: [1234567]
        brightness:
          type: number
          format: float
          description: Last known brightness (0.0–1.0)
        is_on:
          type: boolean
          description: Whether the light is currently on
        state:
          type: string
          description: Last known state byte (hex string)
          examples: ["0x10"]
        rssi:
          type: number
          format: float
          description: Last known RSSI in dBm
          examples: [-65.5]
        last_seen:
          type: integer
          description: Timestamp (millis()) of last RF packet from this light
          examples: [408]

    RemoteConfig:
      type: object
      additionalProperties: false
      required: [address, name]
      properties:
        address:
          type: string
          description: 3-byte remote control address (hex string)
          examples: ["0xb42f01"]
        name:
          type: string
          description: Display name. In native mode, defaults to the hex address.
          examples: ["Remote 0xb42f01"]
        updated_at:
          type: integer
          description: Timestamp (millis()) when last persisted to NVS (0 = derived from config)
          examples: [1234567]

    GroupConfig:
      type: object
      additionalProperties: false
      required: [id, name, device_ids]
      description: |
        Saved group metadata. Groups are not devices and do not store a device
        type; the backend derives and validates the common member type from the
        referenced device ids. Device ids are stable 3-byte device addresses.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 23
          description: Stable group id persisted in NVS.
          examples: ["grp_living_k8x2p1"]
        name:
          type: string
          minLength: 1
          maxLength: 23
          description: Display name.
          examples: ["Living Room"]
        device_ids:
          type: array
          minItems: 2
          maxItems: 48
          uniqueItems: true
          description: Stable device address ids. All must resolve to existing covers or all to existing lights.
          items:
            type: string
            description: 3-byte device address (hex string)
            examples: ["0xa831e5"]

    GroupRemovedData:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          description: Removed group id.
          examples: ["grp_living_k8x2p1"]

    RfData:
      type: object
      additionalProperties: false
      required: [t, src, dst, channel, type, type2, command, state, cnt, rssi, hop, raw]
      properties:
        t:
          type: integer
          description: Timestamp in milliseconds since boot (millis())
          examples: [1234567]
        src:
          type: string
          description: Source address (hex string). Remote for commands, blind for status.
          examples: ["0xa831e5"]
        dst:
          type: string
          description: Destination address (hex string). Blind for commands, remote for status.
          examples: ["0xb42f01"]
        channel:
          type: integer
          description: RF channel
          examples: [5]
        type:
          type: string
          description: |
            Message type byte (hex string):
            - `0x44` — button press/release (broadcast)
            - `0x6a` — targeted command to blind
            - `0x69` — alternate command format
            - `0xca` — status response from blind
            - `0xc9` — alternate status format
          examples: ["0xca"]
        type2:
          type: string
          description: Secondary type byte (hex string)
          examples: ["0x00"]
        command:
          type: string
          description: |
            Command byte (hex string, for command packets):
            - `0x00` — check (request status)
            - `0x10` — stop
            - `0x20` — up/open
            - `0x24` — tilt
            - `0x40` — down/close
            - `0x44` — intermediate position
          examples: ["0x20"]
        state:
          type: string
          description: |
            State byte (hex string, for status packets):
            - `0x00` — unknown
            - `0x01` — top (fully open)
            - `0x02` — bottom (fully closed)
            - `0x03` — intermediate
            - `0x04` — tilt
            - `0x05` — blocking (obstacle)
            - `0x06` — overheated
            - `0x07` — timeout
            - `0x08` — start moving up
            - `0x09` — start moving down
            - `0x0a` — moving up
            - `0x0b` — moving down
            - `0x0d` — stopped
            - `0x0e` — top + tilted
            - `0x0f` — bottom + tilted / light off
            - `0x10` — light on
          examples: ["0x01"]
        cnt:
          type: integer
          description: Rolling counter value from packet (0-255)
          examples: [42]
        rssi:
          type: number
          format: float
          description: Received signal strength in dBm
          examples: [-65.5]
        hop:
          type: string
          description: Hop count byte (hex string)
          examples: ["0x0a"]
        raw:
          type: string
          description: Space-separated hex bytes of the raw packet
          examples: ["1d 2a 6a 00 0a 01 05 a8 31 e5 ..."]

    DeviceUpsertedData:
      type: object
      additionalProperties: false
      required: [address, device_type]
      description: |
        Full device config returned by the server after a successful upsert.
        Contains all fields needed to construct a client-side Device entry.
        Fields vary by device_type: covers include open_ms/close_ms/poll_ms/supports_tilt,
        lights include dim_ms, remotes have only address/device_type/name.
      properties:
        address:
          type: string
          description: 3-byte device address (hex string)
          examples: ["0xa831e5"]
        device_type:
          $ref: "#/components/schemas/DeviceType"
        name:
          type: string
          description: Display name
          examples: ["Living Room Blind"]
        channel:
          type: integer
          description: RF channel number (covers and lights only)
          examples: [5]
        remote:
          type: string
          description: 3-byte remote address (hex string, covers and lights only)
          examples: ["0xb42f01"]
        enabled:
          type: boolean
          description: Whether the device is published to Home Assistant
        open_ms:
          type: integer
          description: Full open duration in ms (covers only)
          examples: [25000]
        close_ms:
          type: integer
          description: Full close duration in ms (covers only)
          examples: [23000]
        poll_ms:
          type: integer
          description: Status poll interval in ms (covers only)
          examples: [300000]
        supports_tilt:
          type: boolean
          description: Whether the cover supports tilt (covers only)
        dim_ms:
          type: integer
          description: Dim duration in ms (lights only, 0 = on/off only)
          examples: [5000]
        updated_at:
          type: integer
          description: Timestamp (millis()) when the device was last persisted to NVS. Non-zero means the device is server-confirmed.
          examples: [1234567]

    CrudEventData:
      type: object
      additionalProperties: false
      required: [address, device_type]
      description: Payload for device_removed events.
      properties:
        address:
          type: string
          description: 3-byte device address (hex string)
          examples: ["0xa831e5"]
        device_type:
          $ref: "#/components/schemas/DeviceType"

    StateChangedData:
      type: object
      additionalProperties: false
      required: [address, device_type]
      description: |
        Snapshot of a device's derived state at the moment of change.
        Sent on user commands (optimistic), RF status responses (confirmed),
        FSM timeouts (recovery), and throttled position updates during movement.
        Fields vary by device_type — covers include position/ha_state/tilted/device_class,
        lights include is_on/brightness.
      properties:
        address:
          type: string
          description: 3-byte device address (hex string)
          examples: ["0xa831e5"]
        device_type:
          $ref: "#/components/schemas/DeviceType"
        # Cover fields (device_type = "cover")
        position:
          type: number
          format: float
          description: Cover position (0.0 = closed, 1.0 = open). Cover only.
        ha_state:
          $ref: "#/components/schemas/HaCoverState"
        tilted:
          type: boolean
          description: Whether the cover is tilted. Cover only.
        device_class:
          type: string
          description: HA device class (shutter, blind, awning, etc.). Cover only.
          examples: ["shutter"]
        # Light fields (device_type = "light")
        is_on:
          type: boolean
          description: Whether the light is on. Light only.
        brightness:
          type: number
          format: float
          description: Light brightness (0.0–1.0). Light only.
        # Shared fields (all device types)
        is_problem:
          type: boolean
          description: Whether the device is in a problem state (blocking, overheated, timeout)
        problem_type:
          $ref: "#/components/schemas/ProblemType"
        rssi:
          type: number
          format: float
          description: Last RSSI in dBm
          examples: [-65.5]
        state:
          $ref: "#/components/schemas/RfStateName"
        command_source:
          $ref: "#/components/schemas/CommandSource"
        last_seen:
          type: integer
          description: Timestamp (millis()) of last RF packet from this device
          examples: [1234567]

    ErrorData:
      type: object
      additionalProperties: false
      required: [msg]
      properties:
        msg:
          type: string
          description: Human-readable error message
          examples: ["Missing dst_address", "CRUD not supported in native mode"]

    LearnInStateData:
      type: object
      additionalProperties: false
      required: [state, active, busy]
      description: Thin snapshot of the backend learn-in session.
      properties:
        state:
          $ref: "#/components/schemas/LearnInState"
        active:
          type: boolean
          description: True while a learn-in session is logically in progress.
        busy:
          type: boolean
          description: True while RF transmissions for the current learn-in step are pending.
        src_address:
          type: string
          description: Virtual remote source address for the current session, if any.
          examples: ["0x17a753"]
        channel:
          type: integer
          description: RF channel for the current session, if any.
          examples: [5]
        programming_cmd:
          type: string
          description: RF command byte used for the programming/P action, if any.
          examples: ["0x55"]

    # ── Client → Server Payloads ──

    CmdPayload:
      type: object
      additionalProperties: false
      required: [type, address, action]
      properties:
        type:
          type: string
          const: cmd
        address:
          type: string
          description: 3-byte destination address of the target device (hex string)
          examples: ["0xa831e5"]
        action:
          $ref: "#/components/schemas/DeviceAction"

    RawPayload:
      type: object
      additionalProperties: false
      required: [type, dst_address, src_address]
      properties:
        type:
          type: string
          const: raw
        dst_address:
          type: string
          description: 3-byte destination address (hex string)
          examples: ["0xa831e5"]
        src_address:
          type: string
          description: 3-byte source address (hex string)
          examples: ["0xb42f01"]
        channel:
          type: integer
          description: RF channel (default 0)
          examples: [5]
        command:
          type: string
          description: Command byte (hex string, default 0x00)
          examples: ["0x20"]
        payload_1:
          type: string
          description: Payload byte 1 (hex string, default 0x00)
          examples: ["0x00"]
        payload_2:
          type: string
          description: Payload byte 2 (hex string, default 0x04)
          examples: ["0x04"]
        msg_type:
          type: string
          description: Message type byte (hex string, default 0x6a)
          examples: ["0x6a"]
        type2:
          type: string
          description: Secondary type byte (hex string, default 0x00)
          examples: ["0x00"]
        hop:
          type: string
          description: Hop count byte (hex string, default 0x0a)
          examples: ["0x0a"]

    LearnInStartPayload:
      type: object
      additionalProperties: false
      required: [type, src_address, channel, programming_cmd]
      description: |
        Starts a backend learn-in session. The frontend must already have guided
        the user through the required power-cycle of the target motor.
      properties:
        type:
          type: string
          const: learn_in_start
        src_address:
          type: string
          description: 3-byte virtual remote/source address (hex string)
          examples: ["0x17a753"]
        channel:
          type: integer
          description: RF channel to learn in
          examples: [5]
        programming_cmd:
          type: string
          description: Empirically determined RF command byte for the remote's programming/P action.
          examples: ["0x55"]
        packets:
          type: integer
          description: Number of RF button packets per learn-in step (default 3)
          examples: [3]
        type2:
          type: string
          description: Secondary type byte for button packets (default 0x10)
          examples: ["0x10"]
        hop:
          type: string
          description: Hop count byte for button packets (default 0x00)
          examples: ["0x00"]
        session_timeout_ms:
          type: integer
          description: Learn-in session timeout in milliseconds (default 300000)
          examples: [300000]

    LearnInConfirmUpPayload:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: learn_in_confirm_up

    LearnInConfirmDownPayload:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: learn_in_confirm_down

    LearnInCancelPayload:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: learn_in_cancel

    UpsertDevicePayload:
      type: object
      additionalProperties: false
      required: [type, device_type, dst_address]
      description: |
        Create or update a device in NVS. The combination of `dst_address` + `device_type`
        identifies the device. All other fields are updateable.
        Only available when `crud` is `true` in the config event.
      properties:
        type:
          type: string
          const: upsert_device
        device_type:
          $ref: "#/components/schemas/DeviceType"
        dst_address:
          type: string
          description: 3-byte destination address (hex string)
          examples: ["0xa831e5"]
        name:
          type: string
          description: Display name for the device
          examples: ["Living Room Blind"]
        enabled:
          type: boolean
          description: Whether the device is enabled (default true)
          default: true
        src_address:
          type: string
          description: 3-byte source/remote address (hex string). Required for cover and light, ignored for remote.
          examples: ["0xb42f01"]
        channel:
          type: integer
          description: RF channel number. Required for cover and light, ignored for remote.
          examples: [5]
        hop:
          type: string
          description: Hop count (hex string, default 0x0a). Ignored for remote.
          examples: ["0x0a"]
        payload_1:
          type: string
          description: Payload byte 1 (hex string, default 0x00). Ignored for remote.
          examples: ["0x00"]
        payload_2:
          type: string
          description: Payload byte 2 (hex string, default 0x04). Ignored for remote.
          examples: ["0x04"]
        msg_type:
          type: string
          description: Message type byte (hex string, default 0x6a). Ignored for remote.
          examples: ["0x6a"]
        type2:
          type: string
          description: Secondary type byte (hex string, default 0x00). Ignored for remote.
          examples: ["0x00"]
        open_duration_ms:
          type: integer
          description: Full open duration in milliseconds (cover only, 0 = position tracking disabled)
          examples: [25000]
        close_duration_ms:
          type: integer
          description: Full close duration in milliseconds (cover only, 0 = position tracking disabled)
          examples: [23000]
        dim_duration_ms:
          type: integer
          description: Dim duration in milliseconds (light only, 0 = on/off only)
          examples: [5000]
        supports_tilt:
          type: boolean
          description: Whether the cover supports tilt (cover only, default false)
          default: false

    RemoveDevicePayload:
      type: object
      additionalProperties: false
      required: [type, dst_address, device_type]
      description: |
        Remove a device from NVS by address and type.
        Only available when `crud` is `true` in the config event.
      properties:
        type:
          type: string
          const: remove_device
        dst_address:
          type: string
          description: 3-byte destination address (hex string)
          examples: ["0xa831e5"]
        device_type:
          $ref: "#/components/schemas/DeviceType"

    UpsertGroupPayload:
      type: object
      additionalProperties: false
      required: [type, id, name, device_ids]
      description: |
        Create or update a saved group in NVS. The backend validates that all
        `device_ids` resolve to existing non-remote devices and that the
        resolved devices are either all covers or all lights.
      properties:
        type:
          type: string
          const: upsert_group
        id:
          type: string
          minLength: 1
          maxLength: 23
          description: Stable group id.
        name:
          type: string
          minLength: 1
          maxLength: 23
          description: Display name.
        device_ids:
          type: array
          minItems: 2
          maxItems: 48
          uniqueItems: true
          items:
            type: string
            description: Stable device address id (hex string).
            examples: ["0xa831e5"]

    RemoveGroupPayload:
      type: object
      additionalProperties: false
      required: [type, id]
      description: Remove a saved group from NVS.
      properties:
        type:
          type: string
          const: remove_group
        id:
          type: string
          description: Group id.

    GroupCmdPayload:
      type: object
      additionalProperties: false
      required: [type, id, action]
      description: |
        Send an action to a saved group. Backend derives the common member type,
        partitions members by remote/src address, and emits one RF group command
        per remote bucket.
      properties:
        type:
          type: string
          const: group_cmd
        id:
          type: string
          description: Group id.
        action:
          $ref: "#/components/schemas/DeviceAction"

    RestartPayload:
      type: object
      additionalProperties: false
      required: [type]
      description: Trigger a safe reboot of the ESP32.
      properties:
        type:
          type: string
          const: restart

    SetHubConfigPayload:
      type: object
      additionalProperties: false
      required: [type, name]
      description: |
        Update hub-level settings. Currently only the display name override is
        configurable. An empty `name` clears the override and falls back to the
        YAML-configured default.
      properties:
        type:
          type: string
          const: set_hub_config
        name:
          type: string
          description: New hub display name. Empty string clears the override.
          maxLength: 31
          examples: ["Living Room Hub"]

    HubConfigEventEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: hub_config
        data:
          $ref: "#/components/schemas/HubConfigEventData"

    HubConfigEventData:
      type: object
      additionalProperties: false
      required: [name]
      description: Hub-level config snapshot after an update.
      properties:
        name:
          type: string
          description: Effective hub display name (override or YAML default).
          examples: ["Elero Gateway"]

    # ── Backup / Restore Snapshot ──

    ExportConfigPayload:
      type: object
      additionalProperties: false
      required: [type]
      description: Trigger a backup snapshot. The server replies (to the requesting client only) with a `config_snapshot` event.
      properties:
        type:
          type: string
          const: export_config

    ConfigSnapshotEventEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: config_snapshot
        data:
          $ref: "#/components/schemas/ConfigSnapshot"

    ConfigSnapshot:
      type: object
      additionalProperties: false
      required: [snapshot_version, exported_at, exporter, hub, devices, groups]
      description: |
        Versioned configuration backup. `snapshot_version` is bumped on
        breaking schema changes; the import handler rejects unknown versions.
      properties:
        snapshot_version:
          type: integer
          description: |
            Snapshot envelope version (currently 2). Must match the C++
            `SNAPSHOT_VERSION` const in `components/elero_web/elero_web_server.cpp` —
            the import handler rejects newer values it doesn't recognise.
          examples: [2]
        exported_at:
          type: integer
          description: Timestamp (millis() since boot on the source device) when exported.
          examples: [1715000000000]
        exporter:
          $ref: "#/components/schemas/SnapshotExporter"
        hub:
          $ref: "#/components/schemas/HubSnapshot"
        devices:
          type: array
          description: All active devices, in slot order.
          items:
            $ref: "#/components/schemas/DeviceSnapshot"
        groups:
          type: array
          description: Saved groups.
          items:
            $ref: "#/components/schemas/GroupConfig"

    SnapshotExporter:
      type: object
      additionalProperties: false
      required: [device, version]
      description: Identification of the device that produced the snapshot.
      properties:
        device:
          type: string
          description: Source device name (`esphome.name`).
          examples: ["elero-gateway"]
        version:
          type: string
          description: Source component version string.
          examples: ["0.10.0"]

    HubSnapshot:
      type: object
      additionalProperties: false
      description: Hub-level overrides to restore. All fields optional.
      properties:
        name_override:
          type: string
          description: |
            Persisted hub display name override. Empty string clears the
            override and falls back to the YAML default.
          examples: ["Living Room Hub"]

    DeviceSnapshot:
      type: object
      additionalProperties: false
      required: [device_type, dst_address]
      description: |
        One device. Mirrors `NvsDeviceConfig` fields. Address fields are
        hex strings (e.g., "0xa831e5"); the import handler accepts both
        hex strings and decimal integers for backward compatibility.
      properties:
        device_type:
          $ref: "#/components/schemas/DeviceType"
        dst_address:
          type: string
          examples: ["0xa831e5"]
        src_address:
          type: string
          description: Source/remote address (covers and lights only).
          examples: ["0xb42f01"]
        channel:
          type: integer
          description: RF channel (covers and lights only).
          examples: [5]
        name:
          type: string
          examples: ["Living Room Blind"]
        enabled:
          type: boolean
          default: true
        open_duration_ms:
          type: integer
          description: Cover open duration in ms (0 = position tracking disabled).
          examples: [25000]
        close_duration_ms:
          type: integer
          description: Cover close duration in ms (0 = position tracking disabled).
          examples: [22000]
        dim_duration_ms:
          type: integer
          description: Light dim duration in ms (0 = on/off only).
          examples: [5000]
        supports_tilt:
          type: boolean
          description: Cover supports tilt.
        ha_device_class:
          type: integer
          description: HaCoverClass enum value (cover only). 0 = shutter.
          examples: [0]
        hop:
          type: string
          description: Hop count byte (hex string, default "0x0a").
          examples: ["0x0a"]
        payload_1:
          type: string
          description: Payload byte 1 (hex string, default "0x00").
          examples: ["0x00"]
        payload_2:
          type: string
          description: Payload byte 2 (hex string, default "0x04").
          examples: ["0x04"]
        msg_type:
          type: string
          description: Message type byte (hex string, default "0x6a").
          examples: ["0x6a"]
        type2:
          type: string
          description: Secondary type byte (hex string, default "0x00").
          examples: ["0x00"]

    ImportConfigPayload:
      type: object
      additionalProperties: false
      required: [type, snapshot]
      description: |
        Restore from a snapshot. Existing devices with the same
        `(device_type, dst_address)` are updated in place; new devices
        are added. Hub overrides (e.g., `name_override`) are applied if present.
      properties:
        type:
          type: string
          const: import_config
        snapshot:
          $ref: "#/components/schemas/ConfigSnapshot"

    ImportResultEventEnvelope:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: import_result
        data:
          $ref: "#/components/schemas/ImportResult"

    ImportResult:
      type: object
      additionalProperties: false
      required: [added, updated, skipped, groups_added, groups_updated, groups_skipped, errors]
      description: Summary of one import operation.
      properties:
        added:
          type: integer
          description: Devices created (no prior `(type, dst_address)` match).
        updated:
          type: integer
          description: Devices updated in place.
        skipped:
          type: integer
          description: Devices not applied (errored or no free slot).
        groups_added:
          type: integer
          description: Groups created.
        groups_updated:
          type: integer
          description: Groups updated in place.
        groups_skipped:
          type: integer
          description: Groups not applied.
        hub_applied:
          type: boolean
          description: Whether hub-level overrides were applied.
        errors:
          type: array
          description: Per-entry errors. Empty on full success.
          items:
            $ref: "#/components/schemas/ImportError"

    ImportError:
      type: object
      additionalProperties: false
      required: [index, msg]
      properties:
        index:
          type: integer
          description: 0-based index into `snapshot.devices` (-1 for envelope-level errors).
        msg:
          type: string
          description: Human-readable error message.

    # ── Shared Enums ──

    HaCoverState:
      type: string
      enum: [open, closed, opening, closing, stopped]
      description: HA-compatible cover state. Cover only.

    ProblemType:
      type: string
      enum: [none, blocking, overheated, timeout]
      description: Problem classification or "none"

    CommandSource:
      type: string
      enum: [unknown, hub, remote]
      description: Who issued the last command

    HubMode:
      type: string
      enum: [native, mqtt]
      description: |
        Operating mode of the hub. Devices always live in NVS (RFC-002);
        the mode only selects how they're surfaced to Home Assistant:
          - `native` — ESPHome native API (NvsAdapter creates entities at boot)
          - `mqtt`   — MQTT HA discovery (MqttAdapter publishes topics)

    LearnInState:
      type: string
      enum: [idle, programming, wait_up, confirming_up, wait_down, confirming_down, complete, failed, cancelled, timed_out]
      description: Backend learn-in session state.

    DeviceAction:
      type: string
      enum: [up, down, open, close, stop, check, tilt, on, off, dim_up, dim_down, int]
      description: |
        Action to perform on a device:
        - Covers: up/open, down/close, stop, check, tilt, int (intermediate)
        - Lights: on, off, stop, check, dim_up, dim_down

    DeviceType:
      type: string
      enum: [cover, light, remote]
      description: Type of device (cover, light, or remote control)

    RfStateName:
      type: string
      enum:
        - unknown
        - top
        - bottom
        - intermediate
        - tilt
        - blocking
        - overheated
        - timeout
        - start_moving_up
        - start_moving_down
        - moving_up
        - moving_down
        - stopped
        - top_tilt
        - bottom_tilt
        - light_on
      description: |
        RF state name as returned by elero_state_to_string().
        Maps 1:1 to the protocol state bytes:
          0x00=unknown, 0x01=top, 0x02=bottom, 0x03=intermediate,
          0x04=tilt, 0x05=blocking, 0x06=overheated, 0x07=timeout,
          0x08=start_moving_up, 0x09=start_moving_down, 0x0a=moving_up,
          0x0b=moving_down, 0x0d=stopped, 0x0e=top_tilt,
          0x0f=bottom_tilt, 0x10=light_on
